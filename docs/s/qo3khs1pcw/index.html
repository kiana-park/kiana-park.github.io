# OCI 인스턴스 생성 — 옵션 선택 가이드

Oracle Cloud 콘솔에서 인스턴스를 처음 만들 때 마주치는 화면들을 순서대로 따라가며,
**헷갈리기 쉬운 옵션마다 "무슨 뜻인지 / 뭘 선택하면 되는지"** 를 정리한 가이드입니다.
(공용 개발 서버 25인 구성 기준이며, 다른 용도라도 개념 설명은 동일하게 적용됩니다)

---

## 0. 시작 전에: 계정 구조 개념 3가지

### 테넌시(Tenancy)가 뭔가요?

가입하면 하나 생기는 **우리 조직의 루트 계정**입니다. AWS의 "AWS 계정"에 해당합니다.
모든 리소스(인스턴스, 볼륨, 네트워크)와 청구서가 테넌시 단위로 묶입니다.

- 테넌시 안은 **컴파트먼트(Compartment)** 라는 폴더로 구획할 수 있습니다
- 리소스 개수 한도(서비스 제한)도 테넌시 단위로 걸립니다
- 콘솔에서 컴파트먼트를 "루트"로 두고 만들어도 동작에는 아무 문제 없습니다

### 홈 리전은 못 바꿉니다

가입할 때 고른 홈 리전은 **영구 고정**입니다. 다만 큰 제약은 아닌 것이:

- 홈 리전은 IAM(유저/정책) 정보가 저장되는 곳일 뿐입니다
- 유료 계정은 다른 리전을 **구독(Subscribe)** 해서 어디든 리소스를 만들 수 있습니다
  (콘솔: Governance & Administration → Tenancy Details → Regions → Subscribe)
- 무료 티어는 홈 리전만 사용 가능하므로 가입 시 신중히 선택하세요

### 서울 vs 춘천, 뭐가 달라요?

**요금·성능 모두 사실상 동일합니다.** Oracle은 전 리전 동일 단가 정책이라 가격 차이가 없고,
국내에서는 어느 쪽이든 지연시간이 한 자릿수 ms 수준입니다.
춘천은 서울의 DR(재해복구) 페어로 지어진 리전이지만 단독으로 사용해도 전혀 문제 없습니다.
→ **인스턴스 생성 시점에 용량(capacity)이 잡히는 쪽으로 선택하시면 됩니다.**

---

## 1. 이름 / 배치

| 화면 항목 | 뜻 | 선택 |
|---|---|---|
| 이름 | 관리용 라벨입니다. 기능과 무관하고 나중에 변경 가능합니다 | `dev-server-01` 처럼 용도가 보이게 (기본값 `instance-날짜`도 무방) |
| 컴파트먼트 | 리소스가 소속될 폴더입니다 | 루트여도 괜찮습니다. 정리하고 싶으면 별도 컴파트먼트 |
| 가용성 도메인 | 리전 내 데이터센터입니다. 한국 리전은 AD-1 하나뿐입니다 | AD-1 (선택지 없음) |
| **용량 유형: on-demand** | **⚠️ "쓴 만큼 시간당 과금"이라는 결제 방식입니다.** 부하에 따라 사양을 자동으로 늘려주는 기능이 **아닙니다** | on-demand |
| 결함 도메인 | AD 내부의 물리 랙 분리입니다. 단일 서버면 무의미합니다 | "오라클이 선택" 그대로 |

## 2. 이미지 (운영체제)

- **Canonical Ubuntu 24.04** 를 권장합니다 (기본 접속 유저: `ubuntu`)
- Oracle Linux를 고르면 기본 유저가 `opc`로 달라집니다 — 접속 에러의 흔한 원인입니다

## 3. 셰이프 — 여기서 가장 많이 실수합니다

### ⚠️ 함정 1: 셰이프를 골라도 사양은 기본값(1 OCPU)입니다

셰이프 목록에 `VM.Standard.E5.Flex — 1 (최대 126) OCPU, 12 (최대 2,098) GB` 라고 표시되는데,
이건 "기본 1이고 **직접** 126까지 올릴 수 있다"는 뜻입니다.
**"온디맨드니까 알아서 늘어나겠지"는 오해입니다** — 셰이프를 클릭하면 나오는
OCPU/메모리 슬라이더에서 원하는 값을 직접 지정해야 합니다.

### ⚠️ 함정 2: OCPU ≠ vCPU

**1 OCPU = 물리 코어 1개 = 2 vCPU** (SMT 사용 시)입니다.
"16 vCPU 서버"가 목표라면 슬라이더에서 **OCPU 8**을 선택해야 합니다.

### 그 외

| 항목 | 설명 | 선택 (25인 서버 기준) |
|---|---|---|
| 셰이프 계열 | E5.Flex(AMD 4세대)를 권장합니다. E6.Flex(최신)가 목록에 있고 요금이 비슷하면 E6도 좋습니다 | VM.Standard.E5.Flex |
| OCPU | 물리 코어 수입니다 | **8** (=16 vCPU) |
| 메모리 | OCPU당 기본 12GB가 따라오지만 **별도 슬라이더로 독립 지정 가능합니다** — 필요량만 잡으면 그만큼 절약됩니다 | **64GB** |
| 네트워크 대역폭 | OCPU 수에 비례해 자동 결정됩니다 | 8 OCPU → 8Gbps (설정 불필요) |
| SMT | 코어당 스레드 2개입니다 | 사용 (기본값) |
| **실드된 인스턴스** | 부트킷/펌웨어 변조 방지 보안 부팅입니다. 무료지만 **커스텀 이미지 생성 등에 제약이 있습니다** | 하단 보안 섹션에서 **보안 부팅/TPM 전부 "사용 안함"** — 그러면 표기가 "실드"여도 실질적으로 일반 인스턴스로 생성됩니다 |

> 과금 참고: E5는 OCPU당 $0.030/h + 메모리 GB당 $0.002/h입니다.
> 8 OCPU + 64GB = $0.368/h ≈ 월 $269. 전 리전 동일가입니다.

## 4. SSH 키 — "프라이빗/퍼블릭이 뭐가 달라요?"

자물쇠(퍼블릭 키)와 열쇠(프라이빗 키) 한 쌍입니다.

| | 퍼블릭 키 (.pub) | 프라이빗 키 |
|---|---|---|
| 역할 | 자물쇠. **서버에 등록**되는 쪽입니다 | 열쇠. **내 PC에만 보관**하는 쪽입니다 |
| 공개되면? | 아무 문제 없습니다 | 서버가 뚫립니다. 절대 공유 금지입니다 |
| 다시 받기 | 프라이빗 키에서 언제든 재생성 가능합니다: `ssh-keygen -y -f 키파일 > key.pub` | **불가능합니다. 이 화면이 마지막 기회입니다** |

**선택: "자동으로 키 쌍 생성" → 프라이빗 키 다운로드 (필수!) → 퍼블릭 키도 받아두면 편합니다(선택)**

주의사항:

- "다시 표시되지 않습니다" = Oracle은 프라이빗 키를 저장하지 않는다는 뜻입니다. 지금 안 받으면 복구 절차가 필요합니다
- 이 키는 **관리자 계정(ubuntu) 1개 전용**입니다. 수강생/팀원 여러 명의 로그인은 서버 생성 후 리눅스 계정을 따로 만들어 각자 키를 등록하는 별개 작업입니다
- 받은 키는 반드시 `chmod 600 키파일` 하세요 — 안 하면 `Permission denied (publickey)` 에러가 납니다 (실화)

## 5. 네트워킹

| 항목 | 설명 | 선택 |
|---|---|---|
| VCN / 서브넷 | 가상 네트워크입니다. 없으면 새로 생성을 선택하세요 | 기존 것 또는 신규 |
| **퍼블릭 IPv4 주소** | 외부에서 SSH 접속하려면 필수입니다 | **예** |
| 네트워크 보안 그룹 | 고급 기능입니다. 기본 보안 목록으로 충분합니다 | 아니오 |

⚠️ 생성 후 SSH가 **타임아웃**되면 십중팔구 VCN 보안 목록 문제입니다:
VCN → 보안 목록 → 인그레스 규칙에 `0.0.0.0/0, TCP, 포트 22` 가 있는지 확인하세요.
(타임아웃 = 방화벽 문제 / `Permission denied` = 키 문제. 에러 메시지로 원인이 구분됩니다)

## 6. 부트 볼륨 — "서비스 제한이 적용됩니다"에 쫄지 마세요

**"사용자정의 부트 볼륨 크기 지정" 체크 → 100GB, VPU 10** 을 권장합니다.
(기본 46.6GB는 OS + Node/Python 런타임 + Docker 이미지가 쌓이면 금방 찹니다)

- **"서비스 제한 적용" 문구의 진짜 뜻**: 테넌시에 할당된 블록 스토리지 총량 한도에서
  늘린 만큼 차감된다는 안내일 뿐입니다. 패널티가 아닙니다.
  유료 계정 기본 한도는 수십 TB라 1~2TB 쓰는 건 전혀 문제 없습니다.
  한도 초과 에러가 나면 콘솔 "한도, 할당량 및 사용량"에서 증가 요청을 하면 됩니다(보통 빠르게 승인됩니다)
- 전송 암호화: 기본값(사용)을 유지하세요. 무료입니다
- **사용자 관리 키(Vault): 건드리지 마세요.** 기업 컴플라이언스용 옵션입니다. Oracle 관리 키가 기본이자 정답입니다

## 7. 블록 볼륨 (데이터 디스크)

| 항목 | 설명 | 선택 (25인 /home 기준) |
|---|---|---|
| 볼륨 이름 | 관리용 라벨입니다. 기능과 무관합니다 | `dev-server-home-1tb` 처럼 용도-내용-크기 |
| 크기 | 나중에 **온라인 확장 가능, 축소는 불가**합니다 → 과하게 시작할 필요 없습니다 | 1,024GB |
| **VPU** | 성능 등급입니다. 0=저가(백업용) / **10=Balanced** / 20=고성능. 무중단 변경 가능합니다 | **10** (1TB 기준 최대 25,000 IOPS — 충분합니다) |

### ⚠️ 연결 유형: "매개변수 가상화"를 선택하세요

콘솔 한국어 번역이 어색해서 헷갈리는 항목입니다. 실제 의미는 다음과 같습니다:

| 콘솔 표기 | 원어 | 뜻 | 선택 |
|---|---|---|---|
| ISCSI | iSCSI | 부팅 후 연결 명령(`iscsiadm`) 3줄을 **수동 실행**해야 디스크가 보입니다. 베어메탈/구형 이미지용입니다 | ✗ |
| **매개변수 가상화** | **Paravirtualized(반가상화)** | 부팅하면 디스크가 **바로** 보입니다. 최신 이미지 VM에 적합합니다 | ✅ |

iSCSI를 고른 채 진행했다면: Oracle Cloud 에이전트의 "블록 볼륨 관리" 플러그인을
'사용'으로 켜면 자동 연결됩니다. 하지만 처음부터 반가상화가 간단합니다.

> 참고: 연결 후에도 볼륨은 빈 디스크입니다. SSH 접속해서 포맷(`mkfs`)/마운트해야 사용 가능합니다.
> 디스크 경로는 `/dev/oracleoci/oraclevdb` 심볼릭 링크를 쓰는 게 안전하지만,
> 이 링크가 안 만들어지는 경우도 있습니다 — 그때는 `lsblk`로 확인 후 `/dev/sdb`를 직접 사용하세요
> (fstab에는 어차피 UUID로 등록하므로 무관합니다)

## 8. Oracle Cloud 에이전트 (플러그인 목록)

기본값 그대로 둬도 되는 섹션입니다. 참고만 하세요:

- **컴퓨트 인스턴스 모니터링**: 사용 (콘솔에서 CPU/메모리 그래프가 보입니다)
- **블록 볼륨 관리**: 반가상화 연결이면 불필요합니다. iSCSI면 켜세요
- Cloud Guard Workload Protection: 기본 '사용'입니다. 무해하고, 리소스를 아끼려면 꺼도 됩니다
- 나머지(취약성 검사, OS 관리 허브, RDMA 계열): 사용 안함 그대로 두세요

## 최종 생성 전 체크리스트

- [ ] 셰이프가 기본값(1 OCPU/12GB)이 아니라 **직접 지정한 값**인가요? (예: 8 OCPU / 64GB)
- [ ] 블록 볼륨 연결 유형이 **매개변수 가상화**인가요?
- [ ] 부트 볼륨을 넉넉히(100GB) 지정했나요?
- [ ] **프라이빗 키를 다운로드했나요?** (지금이 마지막 기회입니다)
- [ ] 퍼블릭 IPv4가 "예"인가요?
- [ ] (생성 후) `chmod 600 키` → `ssh -i 키 ubuntu@IP` 접속을 확인했나요?
- [ ] (접속 실패 시) 타임아웃이면 보안 목록 22번, Permission denied면 키 권한/유저명을 확인하세요

## 생성 후 자주 하는 작업 위치

| 하고 싶은 것 | 콘솔 위치 |
|---|---|
| 사양(OCPU/메모리) 변경 | 인스턴스 정지 → 셰이프 편집 → 시작 (수 분 소요) |
| 디스크 확장 | 블록 볼륨 → 크기 편집 (온라인 가능) → OS에서 `xfs_growfs` |
| VPU(성능) 변경 | 블록 볼륨 → 성능 편집 (무중단) |
| 다른 리전 추가 | Governance & Administration → Tenancy Details → Regions |
| 리소스 한도 확인/증가 | Governance & Administration → 한도, 할당량 및 사용량 |
